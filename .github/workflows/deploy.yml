name: Publicacao do RumoCerto MZ
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run check:syntax
      - run: npm test
      - run: npm run test:integracao
      - run: npm run build
  publicar:
    if: github.event_name != 'pull_request'
    needs: verificar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Validar Worker e configurações de publicação
        run: npm run producao:teste
        env:
          RUMOCERTO_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
          RUMOCERTO_ALLOWED_ORIGIN: https://k6n9.github.io
          RUMOCERTO_PUBLICACAO_ESTRITA: 'true'
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - name: Compilar o site com URL do Worker e Turnstile
        run: npm run build
        env:
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
